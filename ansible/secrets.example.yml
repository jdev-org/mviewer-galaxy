---
# Modèle sans secrets réels. Copier vers secrets.vault.yml, renseigner puis chiffrer :
# ansible-vault encrypt secrets.vault.yml
# Modification ultérieure : ansible-vault edit secrets.vault.yml

# PostgreSQL / PostGIS : partagés par les rôles postgres et geoserver.
postgres_database: donneessig
postgres_username: usersig
postgres_password: ""  # Obligatoire, aucune valeur par défaut.

# GeoServer : compte REST existant, pas de changement du mot de passe par le rôle.
# À la première installation, renseigner le mot de passe initial de la distribution.
# Après changement dans GeoServer, mettre à jour ce Vault avec sa valeur actuelle.
geoserver_admin_username: admin
geoserver_admin_password: ""  # Obligatoire pour le rôle geoserver.

# Studio : générer une clé aléatoire de 32 caractères minimum.
# python3 -c 'import secrets; print(secrets.token_hex(32))'
mviewerstudio_secret_key: ""

# Studio OIDC : requis uniquement avec mviewerstudio_auth_mode: authlib.
# L'issuer et l'identifiant client peuvent aussi être regroupés ici.
# mviewerstudio_oidc_issuer: https://sso.example.org/realms/mviewer
# mviewerstudio_oidc_client_id: mviewerstudio
# mviewerstudio_oidc_client_secret: ""

# Connexion SSH/sudo : facultatif si des mots de passe sont nécessaires.
# Préférer une clé SSH et --ask-become-pass si adaptés à l'environnement.
# ansible_password: ""
# ansible_become_password: ""
# Ne pas stocker ces mots de passe dans l'inventaire ou site.yml.
