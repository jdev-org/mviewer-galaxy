---
geoserver_version: '3.0.2'
geoserver_archive_url: "https://downloads.sourceforge.net/project/geoserver/GeoServer/{{ geoserver_version }}/geoserver-{{ geoserver_version }}-bin.zip"
geoserver_archive_checksum: sha256:66520d9debefb7689b96c8b9b133430f0ebdb28e74ce58b2355d877b8e9a01bc
geoserver_java_package: openjdk-21-jre-headless
geoserver_packages:
  - "{{ geoserver_java_package }}"
  - ca-certificates
  - unzip
geoserver_user: geoserver
geoserver_group: geoserver
geoserver_install_dir: "/opt/geoserver/{{ geoserver_version }}"
geoserver_data_dir: "{{ galaxy_shared_data_dir | default('/srv/data') }}/geoserver/datadir"
geoserver_log_dir: "{{ galaxy_logs_dir | default('/srv/logs') }}/geoserver"
geoserver_work_dir: /var/cache/geoserver
geoserver_download_dir: /var/cache/geoserver-downloads
geoserver_bind_address: 127.0.0.1
geoserver_port: 8080
geoserver_workspace: donnessig
geoserver_datastore: postgis
geoserver_rest_url: "http://127.0.0.1:{{ geoserver_port }}/geoserver"
# Identifiants REST du GeoServer installé : à fournir dans secrets.vault.yml.
# Voir geoserver_admin_username et geoserver_admin_password dans secrets.example.yml.
geoserver_postgres_host: 127.0.0.1
geoserver_postgres_port: "{{ postgres_port | default(5432) }}"
geoserver_catalog_state_file: "{{ geoserver_download_dir }}/postgis-catalog.json"
geoserver_java_options:
  - -Xms256m
  - -Xmx1024m
  - -Djava.awt.headless=true
  # Mitigation recommandée par GeoServer pour CVE-2026-114938.
  - -XX:-UseBASE64Intrinsics

# Installation et mise à jour des extensions (liste dans geoserver_extensions.yml).
geoserver_extensions_cache_dir: "{{ geoserver_download_dir }}/extensions/{{ geoserver_version }}"
geoserver_extensions_lib_dir: "{{ geoserver_install_dir }}/webapps/geoserver/WEB-INF/lib"
geoserver_extensions_service_unit: /etc/systemd/system/geoserver.service
# OGR utilise ogr2ogr ; Image Pyramid peut être préparée avec gdal_retile.py.
# GDAL raster/JNI n'est pas installé.
geoserver_extension_packages: "{{ (['gdal-bin'] if 'ogr-wfs' in (geoserver_extensions | map(attribute='name') | list) else []) + (['python3-gdal'] if 'pyramid' in (geoserver_extensions | map(attribute='name') | list) else []) }}"
