---
galaxy_user: mviewer
galaxy_group: mviewer
galaxy_install_dir: /var/www/mviewergalaxy
galaxy_home_dir: "{{ galaxy_install_dir }}/home"
galaxy_shared_data_dir: /srv/data
galaxy_logs_dir: /srv/logs
galaxy_data_dir: /var/lib/mviewer-galaxy
# Liste commune à la vérification des téléchargements et à l'installation.
galaxy_system_packages:
  - ca-certificates
  - git
  - python3
  - python3-pip
  - python3-venv
  - libxml2-dev
  - libxslt1-dev
  - nginx
mviewer_repository: https://github.com/jdev-org/mviewer.git
# Branche, nom exact de tag ou SHA à déployer (installation et mise à jour).
mviewer_version: master
mviewer_install_dir: "{{ galaxy_install_dir }}/mviewer"
# Équivalent du volume Docker monté sur mviewer/apps.
mviewer_apps_dir: "{{ galaxy_shared_data_dir }}/mviewer/apps"
mviewer_apps_backup_dir: "{{ mviewer_install_dir }}.apps-backup"
mviewer_store_name: store
mviewer_store_dir: "{{ galaxy_shared_data_dir }}/mviewer/{{ mviewer_store_name }}"
mviewer_public_name: public
mviewer_public_dir: "{{ galaxy_shared_data_dir }}/mviewer/{{ mviewer_public_name }}"
mviewer_shared_directories:
  - name: apps
    path: "{{ mviewer_apps_dir }}"
    backup: "{{ mviewer_apps_backup_dir }}"
  - name: "{{ mviewer_store_name }}"
    path: "{{ mviewer_store_dir }}"
    backup: "{{ mviewer_install_dir }}.{{ mviewer_store_name }}-backup"
  - name: "{{ mviewer_public_name }}"
    path: "{{ mviewer_public_dir }}"
    backup: "{{ mviewer_install_dir }}.{{ mviewer_public_name }}-backup"
mviewerstudio_repository: https://github.com/jdev-org/mviewerstudio.git
mviewerstudio_version: oauth2-proxy-keycloak
mviewerstudio_install_dir: /srv/apps/mviewerstudio
mviewerstudio_venv: "{{ mviewerstudio_install_dir }}/.venv"
mviewerstudio_log_dir: "{{ galaxy_logs_dir }}/mviewerstudio"
nginx_log_dir: "{{ galaxy_logs_dir }}/nginx"
mviewerstudio_port: 5007
mviewerstudio_url_prefix: mviewerstudio
mviewerstudio_default_org: public
mviewerstudio_front_config: "{{ galaxy_data_dir }}/mviewerstudio-config.json"
# public : accès sans authentification ; authlib : authentification OIDC.
mviewerstudio_auth_mode: public
nginx_server_name: localhost
nginx_http_port: 80
# Passer à https derrière un terminateur TLS de confiance.
galaxy_public_scheme: http
# À fournir avec ansible-vault (voir README).
mviewerstudio_secret_key: ""
# Paramètres utilisés uniquement avec mviewerstudio_auth_mode: authlib.
mviewerstudio_oidc_issuer: ""
mviewerstudio_oidc_metadata_url: "{{ mviewerstudio_oidc_issuer }}/.well-known/openid-configuration"
mviewerstudio_oidc_client_id: mviewerstudio
mviewerstudio_oidc_client_secret: ""
mviewerstudio_oidc_scope: openid profile email organization
mviewerstudio_oidc_allowed_groups: MVIEWER_ACCESS
mviewerstudio_oidc_claims_mapping:
  organization: organization[0]
