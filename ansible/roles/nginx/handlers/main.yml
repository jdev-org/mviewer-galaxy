---
- name: Valider nginx
  ansible.builtin.command: /usr/sbin/nginx -t
  changed_when: false
  listen: Validate and reload nginx
  when: not ansible_check_mode

- name: Recharger nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  listen: Validate and reload nginx
  when: not ansible_check_mode
