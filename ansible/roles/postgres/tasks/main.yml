---
- name: Vérifier les paramètres réseau PostgreSQL
  ansible.builtin.import_tasks: validate_network.yml

- name: Vérifier les variables PostgreSQL et leur mot de passe obligatoire
  galaxy_postgres:
    password: "{{ postgres_password | default('') }}"
    database: "{{ postgres_database }}"
    username: "{{ postgres_username }}"
    validate_only: true
    minimum_version: "{{ postgres_minimum_version }}"
    minimum_postgis_version: "{{ postgres_minimum_postgis_version }}"
  register: postgres_configuration
  no_log: true

- name: Détecter PostgreSQL avant toute installation
  ansible.builtin.import_tasks: detect_cluster.yml
  vars:
    postgres_cluster_required: "{{ not (postgres_install | bool) }}"

- name: Installer PostgreSQL et PostGIS sans changer de version existante
  ansible.builtin.apt:
    name: "{{ postgres_existing_packages if postgres_matching_clusters | length > 0 else postgres_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: postgres_install | bool

- name: Identifier le cluster créé lors d'une première installation
  ansible.builtin.include_tasks: detect_cluster.yml
  vars:
    postgres_cluster_required: true
  when:
    - postgres_install | bool
    - not ansible_check_mode
    - postgres_matching_clusters | length == 0

- name: Configurer les journaux et leur rotation pour PostgreSQL
  ansible.builtin.include_role:
    name: logging
    apply:
      tags: [postgres]
  vars:
    logging_application: postgresql
    logging_directory: "{{ postgres_log_dir }}"
    logging_owner: postgres
    logging_group: postgres
    logging_config_name: postgresql-common

- name: Diriger la sortie des clusters vers leur journal géré par Debian
  ansible.builtin.blockinfile:
    path: "{{ item.configfile }}"
    marker: '# {mark} MVIEWER GALAXY LOGGING'
    block: |
      logging_collector = off
      log_destination = 'stderr'
  loop: "{{ postgres_matching_clusters }}"
  loop_control:
    label: "{{ item.configfile }}"
  register: postgres_log_config
  notify: Restart postgresql configuration

- name: Diriger les journaux des clusters vers le répertoire partagé
  ansible.builtin.file:
    src: "{{ postgres_log_dir }}/postgresql-{{ item.version }}-{{ item.cluster }}.log"
    dest: "{{ item.configfile | dirname }}/log"
    state: link
    force: true
    follow: false
    owner: postgres
    group: postgres
  loop: "{{ postgres_matching_clusters }}"
  loop_control:
    label: "{{ item.configfile }}"
  register: postgres_log_links
  notify: Restart postgresql configuration

- name: Activer et démarrer uniquement le cluster PostgreSQL sélectionné
  ansible.builtin.service:
    name: "postgresql@{{ postgres_matching_clusters[0].version }}-{{ postgres_matching_clusters[0].cluster }}"
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Réutiliser la base SIG existante ou la créer si absente
  galaxy_postgres:
    password: "{{ postgres_password | default('') }}"
    database: "{{ postgres_database }}"
    username: "{{ postgres_username }}"
    port: "{{ postgres_port }}"
    socket_dir: "{{ postgres_socket_dir }}"
    minimum_version: "{{ postgres_minimum_version }}"
    minimum_postgis_version: "{{ postgres_minimum_postgis_version }}"
  register: postgres_database_result
  no_log: true
  when: not ansible_check_mode

- name: Présenter la base PostgreSQL retenue
  ansible.builtin.debug:
    msg: "Base {{ postgres_database_result.database }} {{ 'réutilisée' if postgres_database_result.database_reused else 'créée' }} ; PostgreSQL {{ postgres_database_result.server_version }}, PostGIS {{ postgres_database_result.postgis_version }}."
  when: not ansible_check_mode

- name: Configurer les accès réseau PostgreSQL depuis le template préparé
  ansible.builtin.include_tasks: access.yml
  when: not ansible_check_mode
