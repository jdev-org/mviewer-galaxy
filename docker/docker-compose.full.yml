name: mviewer-keycloak

services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.28.0
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GEOSERVER_HTTP_PORT:-8081}:8080"
    environment:
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "true"
      GEOSERVER_VERSION: "2.28-SNAPSHOT"
      STABLE_EXTENSIONS: "wps,vectortiles,querylayer"
      COMMUNITY_EXTENSIONS: "sec-oidc"
      COMMUNITY_PLUGIN_URL: "https://build.geoserver.org/geoserver/2.28.x/community-latest"
      INSTALL_EXTENSIONS: "true"
      PROXY_BASE_URL: "${GEOSERVER_PROXY_BASE_URL:-http://host.docker.internal/geoserver}"
    volumes:
      - ../resources/geoserver/datadir:/opt/geoserver_data

  mviewer:
    image: mviewer/mviewer
    volumes:
      - ../resources/mviewer/apps:/usr/share/nginx/html/apps:ro

  mviewerstudio:
    build:
      context: /home/gaetan/projects/jdev/mviewerstudio
      dockerfile: docker/Dockerfile
    pull_policy: build
    image: mviewer/mviewerstudio:galaxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -c
      - >
        python /opt/mviewerstudio/render_config.py
        /opt/mviewerstudio/templates/config.json.template
        ${USER_HOME:-/home/mvuser}/src/static/config.json &&
        exec gunicorn -w 1 -b 0.0.0.0:8000 src.app:app
    env_file:
      - .env.docker
    environment:
      CONF_PATH_FROM_MVIEWER: ${MVIEWER_STORE_PATH:-apps/store}
      CONF_PUBLISH_PATH_FROM_MVIEWER: ${MVIEWER_PUBLIC_PATH:-apps/public}
      DEFAULT_ORG: ${MVIEWERSTUDIO_DEFAULT_ORG:-public}
      EXPORT_CONF_FOLDER: ${USER_HOME:-/home/mvuser}/${MVIEWER_STORE_PATH:-apps/store}
      MVIEWERSTUDIO_AUTH_TYPE: keycloak
      MVIEWERSTUDIO_AUTH_ALLOWED_ROLES: ${MVIEWERSTUDIO_AUTH_ALLOWED_ROLES:-MVIEWER_ACCESS}
      MVIEWERSTUDIO_PUBLISH_PATH: ${USER_HOME:-/home/mvuser}/apps/public
      MVIEWERSTUDIO_URL_PATH_PREFIX: ${MVIEWERSTUDIO_URL_PATH_PREFIX:-mviewerstudio}
    volumes:
      - ../resources/mviewer/apps:${USER_HOME:-/home/mvuser}/apps
      - ./mviewerstudio/templates:/opt/mviewerstudio/templates:ro
      - ./mviewerstudio/render_config.py:/opt/mviewerstudio/render_config.py:ro

  keycloak:
    env_file:
      - .env.docker
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://host.docker.internal/keycloak}
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ../resources/keycloak/mviewer-realm.json:/opt/keycloak/data/import/mviewer-realm.json:ro

  oauth2-proxy:
    env_file:
      - .env.docker
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
    depends_on:
      - keycloak
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --skip-oidc-discovery=true
      - --oidc-issuer-url=${OAUTH2_PROXY_OIDC_ISSUER_URL:-http://host.docker.internal/keycloak/realms/mviewer}
      - --login-url=${OAUTH2_PROXY_LOGIN_URL:-http://host.docker.internal/keycloak/realms/mviewer/protocol/openid-connect/auth}
      - --redeem-url=${OAUTH2_PROXY_REDEEM_URL:-http://keycloak:8080/keycloak/realms/mviewer/protocol/openid-connect/token}
      - --oidc-jwks-url=${OAUTH2_PROXY_OIDC_JWKS_URL:-http://keycloak:8080/keycloak/realms/mviewer/protocol/openid-connect/certs}
      - --validate-url=${OAUTH2_PROXY_VALIDATE_URL:-http://keycloak:8080/keycloak/realms/mviewer/protocol/openid-connect/userinfo}
      - --redirect-url=${OAUTH2_PROXY_REDIRECT_URL:-http://host.docker.internal/oauth2/callback}
      - --client-id=${OAUTH2_PROXY_CLIENT_ID:-mviewerstudio}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET:-mviewerstudio-local-secret}
      - --scope=${OAUTH2_PROXY_SCOPE:-openid email profile organization roles}
      - --email-domain=*
      - --allowed-role=${OAUTH2_PROXY_ALLOWED_ROLE:-mviewerstudio:MVIEWER_ACCESS}
      - --oidc-groups-claim=${OAUTH2_PROXY_OIDC_GROUPS_CLAIM:-organization}
      - --reverse-proxy=true
      - --cookie-secure=${OAUTH2_PROXY_COOKIE_SECURE:-false}
      - --cookie-samesite=${OAUTH2_PROXY_COOKIE_SAMESITE:-lax}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET:-0123456789abcdef0123456789abcdef}
      - --set-xauthrequest=true
      - --set-authorization-header=true
      - --pass-access-token=true
      - --pass-user-headers=true
      - --standard-logging=true
      - --auth-logging=true
      - --request-logging=true
      - --show-debug-on-error=true
      - --whitelist-domain=${OAUTH2_PROXY_WHITELIST_DOMAIN:-host.docker.internal}

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - geoserver
      - mviewer
      - mviewerstudio
      - keycloak
      - oauth2-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - target: 80
        published: "${PROXY_HTTP_PORT:-80}"
        protocol: tcp
        host_ip: "${PROXY_HTTP_HOST_IP:-0.0.0.0}"
    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../resources/mviewer/apps:/usr/share/nginx/html/apps:ro
    env_file:
      - .env.docker
    environment:
      NGINX_HOST: ${NGINX_HOST:-host.docker.internal}
      MVIEWERSTUDIO_URL_PATH_PREFIX: ${MVIEWERSTUDIO_URL_PATH_PREFIX:-mviewerstudio}
