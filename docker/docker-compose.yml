name: mviewer-galaxy

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      mviewer:
        condition: service_started
      mviewerstudio:
        condition: service_started
      keycloak:
        condition: service_healthy
        required: false
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    env_file:
      - ./envs/.envs-proxy
    volumes:
      - ./nginx/templates/authlib-keycloak-optional.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${MVIEWER_APPS_PATH:-../resources/mviewer/apps}:/usr/share/nginx/html/apps:ro
      - ${MVIEWER_STORE_PATH:-../resources/mviewer/store}:/usr/share/nginx/html/store:ro
      - ${MVIEWER_PUBLIC_PATH:-../resources/mviewer/public}:/usr/share/nginx/html/public:ro

  mviewer:
    image: mviewer/mviewer
    restart: unless-stopped
    volumes:
      - ${MVIEWER_APPS_PATH:-../resources/mviewer/apps}:/usr/share/nginx/html/apps:ro
      - ${MVIEWER_STORE_PATH:-../resources/mviewer/store}:/usr/share/nginx/html/store:ro
      - ${MVIEWER_PUBLIC_PATH:-../resources/mviewer/public}:/usr/share/nginx/html/public:ro

  mviewerstudio:
    build:
      context: ../mviewerstudio
      dockerfile: docker/Dockerfile
    image: mviewer/mviewerstudio:keycloak
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
        required: false
    # Match the owner of the shared directories on the host.
    user: "${MVIEWERSTUDIO_UID:-1000}:${MVIEWERSTUDIO_GID:-1000}"
    env_file:
      - ./envs/.envs-mviewerstudio
    volumes:
      - ${MVIEWER_APPS_PATH:-../resources/mviewer/apps}:/home/mvuser/apps
      - ${MVIEWER_STORE_PATH:-../resources/mviewer/store}:/home/mvuser/store
      - ${MVIEWER_PUBLIC_PATH:-../resources/mviewer/public}:/home/mvuser/public

  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    command: start-dev --import-realm
    env_file:
      - ./envs/.envs-keycloak
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /keycloak/realms/mviewer/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r version code rest <&3;
          test "$$code" = 200
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    volumes:
      - ../resources/keycloak/mviewer-realm.json:/opt/keycloak/data/import/mviewer-realm.json:ro
