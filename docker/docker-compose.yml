name: mviewer-lite

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      mviewer:
        condition: service_started
      mviewerstudio:
        condition: service_started
      keycloak:
        condition: service_started
        required: false
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    environment:
      NGINX_HOST: ${NGINX_HOST:-localhost}
      MVIEWERSTUDIO_URL_PATH_PREFIX: mviewerstudio
    volumes:
      - ./nginx/templates/authlib-keycloak-optional.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../resources/mviewer/apps:/usr/share/nginx/html/apps:ro
      - ../resources/mviewer/store:/usr/share/nginx/html/store:ro
      - ../resources/mviewer/public:/usr/share/nginx/html/public:ro

  mviewer:
    image: mviewer/mviewer
    restart: unless-stopped
    volumes:
      - ../resources/mviewer/apps:/usr/share/nginx/html/apps:ro
      - ../resources/mviewer/store:/usr/share/nginx/html/store:ro
      - ../resources/mviewer/public:/usr/share/nginx/html/public:ro

  mviewerstudio:
    build:
      context: ../mviewerstudio
      dockerfile: docker/Dockerfile
    image: mviewer/mviewerstudio:keycloak
    restart: unless-stopped
    # Match the owner of resources/mviewer/apps on the host.
    user: "${MVIEWERSTUDIO_UID:-1000}:${MVIEWERSTUDIO_GID:-1000}"
    environment:
      CONF_PATH_FROM_MVIEWER: apps/store
      CONF_PUBLISH_PATH_FROM_MVIEWER: apps/public
      DEFAULT_ORG: ${MVIEWERSTUDIO_DEFAULT_ORG:-jdev}
      EXPORT_CONF_FOLDER: /home/mvuser/apps/store
      MVIEWERSTUDIO_PUBLISH_PATH: /home/mvuser/apps/public
      MVIEWERSTUDIO_URL_PATH_PREFIX: mviewerstudio
      MVIEWERSTUDIO_AUTH_MODE: authlib
      MVIEWERSTUDIO_AUTHLIB_ISSUER: ${MVIEWERSTUDIO_AUTHLIB_ISSUER:?Renseigner MVIEWERSTUDIO_AUTHLIB_ISSUER dans docker/.env.docker}
      MVIEWERSTUDIO_AUTHLIB_METADATA_URL: ${MVIEWERSTUDIO_AUTHLIB_METADATA_URL:-http://keycloak:8080/keycloak/realms/mviewer/.well-known/openid-configuration}
      MVIEWERSTUDIO_AUTHLIB_CLIENT_ID: ${MVIEWERSTUDIO_AUTHLIB_CLIENT_ID:-mviewerstudio}
      MVIEWERSTUDIO_AUTHLIB_CLIENT_SECRET: ${MVIEWERSTUDIO_AUTHLIB_CLIENT_SECRET:?Renseigner MVIEWERSTUDIO_AUTHLIB_CLIENT_SECRET dans docker/.env.docker}
      MVIEWERSTUDIO_AUTHLIB_SCOPE: ${MVIEWERSTUDIO_AUTHLIB_SCOPE:-openid profile email organization}
      MVIEWERSTUDIO_AUTHLIB_ALLOWED_GROUPS: ${MVIEWERSTUDIO_AUTHLIB_ALLOWED_GROUPS:-MVIEWER_ACCESS}
      SECRET_KEY: ${MVIEWERSTUDIO_SECRET_KEY:?Renseigner MVIEWERSTUDIO_SECRET_KEY dans docker/.env.docker}
    volumes:
      - ../resources/mviewer/apps:/home/mvuser/apps
      - ../resources/mviewer/store:/home/mvuser/store
      - ../resources/mviewer/public:/home/mvuser/public

  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost/keycloak}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ../resources/keycloak/mviewer-realm.json:/opt/keycloak/data/import/mviewer-realm.json:ro
