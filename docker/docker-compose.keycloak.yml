name: mviewer-keycloak

services:
  proxy:
    depends_on:
      - mviewer
      - mviewerstudio
      - keycloak
      - oauth2-proxy
      - geoserver
    links:
      - mviewer
      - mviewerstudio
      - keycloak
      - oauth2-proxy
    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../resources/mviewer/apps:/usr/share/nginx/html/apps:ro

  mviewerstudio:
    image: mviewer/mviewerstudio:galaxy
    environment:
      MVIEWERSTUDIO_AUTH_TYPE: keycloak

  postgres:
    env_file:
      - .env.docker
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    env_file:
      - .env.docker
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost/keycloak}
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ../resources/keycloak/mviewer-realm.json:/opt/keycloak/data/import/mviewer-realm.json:ro

  oauth2-proxy:
    env_file:
      - .env.docker
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
    depends_on:
      - keycloak
    links:
      - keycloak
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --skip-oidc-discovery=true
      - --oidc-issuer-url=${OAUTH2_PROXY_OIDC_ISSUER_URL:-http://localhost/keycloak/realms/mviewer}
      - --login-url=${OAUTH2_PROXY_LOGIN_URL:-http://localhost/keycloak/realms/mviewer/protocol/openid-connect/auth}
      - --redeem-url=${OAUTH2_PROXY_REDEEM_URL:-http://keycloak:8080/keycloak/realms/mviewer/protocol/openid-connect/token}
      - --oidc-jwks-url=${OAUTH2_PROXY_OIDC_JWKS_URL:-http://keycloak:8080/keycloak/realms/mviewer/protocol/openid-connect/certs}
      - --redirect-url=${OAUTH2_PROXY_REDIRECT_URL:-http://localhost/oauth2/callback}
      - --client-id=${OAUTH2_PROXY_CLIENT_ID:-mviewerstudio}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET:-mviewerstudio-local-secret}
      - --scope=${OAUTH2_PROXY_SCOPE:-openid email profile organization roles}
      - --email-domain=*
      - --allowed-role=${OAUTH2_PROXY_ALLOWED_ROLE:-MVIEWER_ACCESS}
      - --oidc-groups-claim=organization
      - --reverse-proxy=true
      - --cookie-secure=false
      - --cookie-samesite=lax
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET:-0123456789abcdef0123456789abcdef}
      - --set-xauthrequest=true
      - --set-authorization-header=true
      - --pass-access-token=true
      - --pass-user-headers=true
      - --standard-logging=true
      - --auth-logging=true
      - --request-logging=true
      - --show-debug-on-error=true
      - --http-address=0.0.0.0:4180
      - --validate-url=http://mviewer-keycloak-proxy-1/keycloak/realms/mviewer/protocol/openid-connect/userinfo
      - --whitelist-domain=localhost

volumes:
  postgres_data:
