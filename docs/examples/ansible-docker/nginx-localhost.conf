# Relais interne pour les URL publiques du test http://localhost:8088/.
# Le port 80 reste publié par Docker sur le port 8088 de l'hôte.
server {
    listen 127.0.0.1:8088;
    server_name localhost;

    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:80;
    }
}
